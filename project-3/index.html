<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssey</title>

  <!-- 花一点的标题字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #d9e1ea;
      font-family: 'Cinzel', serif;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* UI层（不影响背景） */
    .ui {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 80px;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 10px 30px rgba(0,0,0,0.25);
      margin-bottom: 40px;
    }

    .btn {
      padding: 12px 32px;
      border: 1px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .btn:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

<!-- UI层 -->
<div class="ui">
  <h1>ODYSSEY</h1>
  <button class="btn" onclick="goNext()">START</button>
</div>

<script>
function goNext(){
  window.location.href = "page2.html";
}

/* ===== 下面完全是你原来的代码，一点没动 ===== */

let drops = [];
let ripples = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  noiseSeed(8);
  randomSeed(8);

  for (let i = 0; i < 260; i++) {
    drops.push(new Drop(true));
  }
}

function draw() {
  drawBackground();
  drawAtmosphere();
  drawRainStreaks();
  updateAndDrawRipples();
  drawForegroundWetness();
  drawVignette();
}

function drawBackground() {
  for (let y = 0; y < height; y++) {
    let t = y / height;
    let c = lerpColor(color(229, 234, 240), color(160, 173, 186), t);
    stroke(c);
    line(0, y, width, y);
  }

  noStroke();
  fill(255, 255, 255, 10);
  ellipse(width * 0.5, height * 0.28, width * 0.8, height * 0.12);

  fill(120, 140, 160, 8);
  ellipse(width * 0.5, height * 0.72, width * 0.9, height * 0.18);
}

function drawAtmosphere() {
  noStroke();

  fill(255, 255, 255, 8);
  ellipse(width * 0.5, height * 0.78, width * 0.9, height * 0.08);

  fill(255, 255, 255, 5);
  ellipse(width * 0.5, height * 0.52, width * 0.7, height * 0.06);
}

function drawRainStreaks() {
  strokeWeight(1.2);

  for (let d of drops) {
    let alpha = map(d.depth, 0.15, 1, 40, 180);
    let len = map(d.depth, 0.15, 1, 10, 26);
    let slant = map(d.depth, 0.15, 1, 1.5, 6.5);
    let speed = map(d.depth, 0.15, 1, 6, 18);

    stroke(255, 255, 255, alpha);
    line(d.x, d.y, d.x + slant, d.y + len);

    d.x += slant * 0.55;
    d.y += speed;

    if (d.y >= d.targetY) {
      ripples.push(new Ripple(d.x, d.targetY, d.depth));
      d.reset(false);
    }

    if (d.x > width + 40) {
      d.reset(false);
    }
  }

  strokeWeight(1.7);
  for (let i = 0; i < 140; i++) {
    let x = (i * 97 + frameCount * 2.8) % (width + 240) - 120;
    let y = (i * 59 + frameCount * 8.5) % (height + 260) - 120;
    let n = noise(i * 0.09, frameCount * 0.012);
    if (n < 0.52) continue;

    let len = 12 + n * 20;
    let dx = 2 + n * 6;
    stroke(255, 255, 255, 30 + n * 120);
    line(x, y, x + dx, y + len);
  }
}

function updateAndDrawRipples() {
  for (let i = ripples.length - 1; i >= 0; i--) {
    let r = ripples[i];
    r.update();
    r.draw();
    if (r.dead()) ripples.splice(i, 1);
  }
}

function drawForegroundWetness() {
  noStroke();
  for (let i = 0; i < 10; i++) {
    fill(255, 255, 255, 4);
    ellipse(width * 0.5, height * 0.78 + i * 3, width * (0.85 + i * 0.03), 18 + i * 2);
  }
}

function drawVignette() {
  let ctx = drawingContext;
  let g = ctx.createRadialGradient(
    width * 0.5, height * 0.5, min(width, height) * 0.18,
    width * 0.5, height * 0.5, max(width, height) * 0.8
  );
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.8, "rgba(0,0,0,0.10)");
  g.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, width, height);
}

class Drop {
  constructor(init = false) {
    this.reset(init);
  }

  reset(init = false) {
    this.x = random(-width * 0.05, width * 1.05);
    this.y = init ? random(-height, height) : random(-220, -20);
    this.depth = random(0.15, 1);
    this.targetY = random(height * 0.35, height * 0.96);
  }
}

class Ripple {
  constructor(x, y, depth) {
    this.x = x;
    this.y = y;
    this.depth = depth;
    this.radius = random(2, 7);
    this.maxRadius = map(depth, 0.15, 1, 18, 42);
    this.alpha = map(depth, 0.15, 1, 70, 180);
    this.skew = random(0.88, 1.18);
    this.jitter = random(0.6, 1.6);
  }

  update() {
    this.radius += map(this.depth, 0.15, 1, 1.0, 2.6);
    this.alpha -= map(this.depth, 0.15, 1, 3.5, 6.5);
  }

  draw() {
    noFill();

    stroke(255, 255, 255, this.alpha);
    strokeWeight(map(this.depth, 0.15, 1, 1, 1.8));

    let rx = this.radius * this.skew;
    let ry = this.radius * 0.42;

    beginShape();
    for (let a = 0; a < TWO_PI + 0.2; a += 0.22) {
      let n = noise(cos(a) * 0.8 + frameCount * 0.01, sin(a) * 0.8 + frameCount * 0.01);
      let wobble = map(n, 0, 1, -this.jitter, this.jitter);
      let x = this.x + cos(a) * (rx + wobble);
      let y = this.y + sin(a) * (ry + wobble * 0.35);
      vertex(x, y);
    }
    endShape(CLOSE);

    stroke(255, 255, 255, this.alpha * 0.45);
    ellipse(this.x, this.y, rx * 1.35, ry * 0.9);

    noStroke();
    fill(255, 255, 255, this.alpha * 0.55);
    ellipse(this.x, this.y, 2.2, 1.2);
  }

  dead() {
    return this.alpha <= 0 || this.radius > this.maxRadius * 2.6;
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>

</body>
</html>
